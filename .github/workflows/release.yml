name: Release (signed, auto-update)

# v0.1.5 などのタグを push すると、Windows版とMac版をビルド・署名し、
# GitHub Release に latest.json 付きで公開する（自動アップデート用）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm install

      # ReazonSpeech常駐サーバー（sherpa-onnx）をサイドカーとして取得（リポジトリ未収載のため毎回取得）
      - name: Fetch ReazonSpeech server sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          curl -L --retry 5 -o sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-v1.13.3-osx-universal2-static.tar.bz2
          tar -xjf sherpa.tar.bz2
          mkdir -p src-tauri/binaries
          for t in aarch64-apple-darwin x86_64-apple-darwin universal-apple-darwin; do
            cp sherpa-onnx-v1.13.3-osx-universal2-static/bin/sherpa-onnx-offline-websocket-server "src-tauri/binaries/sherpa-onnx-offline-websocket-server-$t"
          done

      - name: Fetch ReazonSpeech server sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.3/sherpa-onnx-v1.13.3-win-x64-static-MT-Release.tar.bz2"
          Invoke-WebRequest -Uri $url -OutFile sherpa.tar.bz2
          tar -xjf sherpa.tar.bz2
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item "sherpa-onnx-v1.13.3-win-x64-static-MT-Release/bin/sherpa-onnx-offline-websocket-server.exe" "src-tauri/binaries/sherpa-onnx-offline-websocket-server-x86_64-pc-windows-msvc.exe" -Force

      - name: Build + sign + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KaikeiVoice ${{ github.ref_name }}'
          releaseBody: '自動アップデート対応リリース。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
